trigger:
    - main

pr: none

resources:
    - repo: self

variables:
    - group: public-npm
    - name: envName
      value: "brandup-ui-kit"
    - name: version-major
      value: "1"
    - name: version-minor
      value: "2"

name: $(version-major).$(version-minor).$(rev:r)

pool:
    name: Test

stages:
    - stage: "Build"
      displayName: "Build"
      jobs:
          - job: "BuildNpm"
            displayName: "Build, test and pack"
            pool:
                name: Test
                workspace:
                    clean: all
            steps:
                - script: |
                      echo "Begin build $(Build.BuildNumber)!"
                  displayName: "print variables"

                - checkout: self
                  fetchDepth: "1"
                  clean: "true"
                  persistCredentials: "true"

                - task: UseNode@1
                  displayName: use node 22.x
                  inputs:
                      version: 22.x
                      checkLatest: true

                - script: npm run i
                  displayName: "npm install"

                # Source checks run before the build: they are cheaper than it and fail more clearly,
                # and digging into a type error in a built package while an uncleaned lint sits next to it
                # takes longer than fixing the lint.
                - script: npm run lint
                  displayName: "lint"

                - script: npm run format:check
                  displayName: "format check"

                - script: npm run build
                  displayName: "packages npm build"

                - script: npm run test
                  displayName: "packages npm test"

                - script: npm run npm:version $(Build.BuildNumber)
                  displayName: "packages npm version"

                - script: npm run npm:cleanup
                  displayName: "packages npm cleanup"

                - script: npm run npm:pack --pack-destination "$(Build.ArtifactStagingDirectory)"
                  displayName: "packages npm pack"

                - publish: $(Build.ArtifactStagingDirectory)
                  displayName: publish artifact
                  condition: succeededOrFailed()
                  artifact: npm

          - job: GitTag
            displayName: "Add git tag"
            dependsOn: [BuildNpm]
            condition: succeeded()
            steps:
                - checkout: self
                  clean: "true"
                  persistCredentials: "true"

                - script: |
                      echo Tagging $(Build.Repository.Name) with $(Build.BuildNumber)
                      git config user.name "AzureDevOps Agent"
                      git tag "$(Build.BuildNumber)" --force
                      git push origin "$(Build.BuildNumber)" --force
                  displayName: set git tag

    - stage: Production
      displayName: Deploy stage
      dependsOn: Build
      jobs:
          - deployment: Production
            condition: succeeded()
            displayName: "NPM"
            pool:
                name: Test
            environment: $(envName)
            strategy:
                runOnce:
                    deploy:
                        steps:
                            - download: current
                              displayName: "download artifacts"
                              artifact: npm

                            - task: ExtractFiles@1
                              displayName: "unzip brandup-ui-kit"
                              inputs:
                                  archiveFilePatterns: "$(Pipeline.Workspace)/npm/brandup-ui-kit-$(Build.BuildNumber).tgz"
                                  destinationFolder: "$(Pipeline.Workspace)/npmout/brandup-ui-kit"
                                  cleanDestinationFolder: true
                                  overwriteExistingFiles: true

                            - task: ExtractFiles@1
                              displayName: "unzip brandup-ui-input"
                              inputs:
                                  archiveFilePatterns: "$(Pipeline.Workspace)/npm/brandup-ui-input-$(Build.BuildNumber).tgz"
                                  destinationFolder: "$(Pipeline.Workspace)/npmout/brandup-ui-input"
                                  cleanDestinationFolder: true
                                  overwriteExistingFiles: true

                            - task: ExtractFiles@1
                              displayName: "unzip brandup-ui-textbox"
                              inputs:
                                  archiveFilePatterns: "$(Pipeline.Workspace)/npm/brandup-ui-textbox-$(Build.BuildNumber).tgz"
                                  destinationFolder: "$(Pipeline.Workspace)/npmout/brandup-ui-textbox"
                                  cleanDestinationFolder: true
                                  overwriteExistingFiles: true

                            - task: ExtractFiles@1
                              displayName: "unzip brandup-ui-dropdown"
                              inputs:
                                  archiveFilePatterns: "$(Pipeline.Workspace)/npm/brandup-ui-dropdown-$(Build.BuildNumber).tgz"
                                  destinationFolder: "$(Pipeline.Workspace)/npmout/brandup-ui-dropdown"
                                  cleanDestinationFolder: true
                                  overwriteExistingFiles: true

                            - task: ExtractFiles@1
                              displayName: "unzip brandup-ui-richeditor"
                              inputs:
                                  archiveFilePatterns: "$(Pipeline.Workspace)/npm/brandup-ui-richeditor-$(Build.BuildNumber).tgz"
                                  destinationFolder: "$(Pipeline.Workspace)/npmout/brandup-ui-richeditor"
                                  cleanDestinationFolder: true
                                  overwriteExistingFiles: true

                            - task: ExtractFiles@1
                              displayName: "unzip brandup-ui-messageeditor"
                              inputs:
                                  archiveFilePatterns: "$(Pipeline.Workspace)/npm/brandup-ui-messageeditor-$(Build.BuildNumber).tgz"
                                  destinationFolder: "$(Pipeline.Workspace)/npmout/brandup-ui-messageeditor"
                                  cleanDestinationFolder: true
                                  overwriteExistingFiles: true

                            - task: UseNode@1
                              displayName: use node 22.x
                              inputs:
                                  version: 22.x
                                  checkLatest: true

                            # npmAuthenticate adds the token of the service connection to this file.
                            - script: echo registry=https://registry.npmjs.org/> "$(Pipeline.Workspace)/.npmrc"
                              displayName: "create .npmrc"

                            - task: npmAuthenticate@0
                              displayName: "npm authenticate"
                              inputs:
                                  workingFile: "$(Pipeline.Workspace)/.npmrc"
                                  customEndpoint: "$(publish-npm-credentials)"

                            # brandup-ui-kit

                            - script: npm publish --userconfig "$(Pipeline.Workspace)/.npmrc"
                              displayName: "publish brandup-ui-kit"
                              workingDirectory: "$(Pipeline.Workspace)/npmout/brandup-ui-kit/package"

                            # brandup-ui-input

                            - script: npm publish --userconfig "$(Pipeline.Workspace)/.npmrc"
                              displayName: "publish brandup-ui-input"
                              workingDirectory: "$(Pipeline.Workspace)/npmout/brandup-ui-input/package"

                            # brandup-ui-richeditor

                            - script: npm publish --userconfig "$(Pipeline.Workspace)/.npmrc"
                              displayName: "publish brandup-ui-richeditor"
                              workingDirectory: "$(Pipeline.Workspace)/npmout/brandup-ui-richeditor/package"

                            # brandup-ui-messageeditor

                            - script: npm publish --userconfig "$(Pipeline.Workspace)/.npmrc"
                              displayName: "publish brandup-ui-messageeditor"
                              workingDirectory: "$(Pipeline.Workspace)/npmout/brandup-ui-messageeditor/package"

                            # brandup-ui-textbox

                            - script: npm publish --userconfig "$(Pipeline.Workspace)/.npmrc"
                              displayName: "publish brandup-ui-textbox"
                              workingDirectory: "$(Pipeline.Workspace)/npmout/brandup-ui-textbox/package"

                            # brandup-ui-dropdown

                            - script: npm publish --userconfig "$(Pipeline.Workspace)/.npmrc"
                              displayName: "publish brandup-ui-dropdown"
                              workingDirectory: "$(Pipeline.Workspace)/npmout/brandup-ui-dropdown/package"
